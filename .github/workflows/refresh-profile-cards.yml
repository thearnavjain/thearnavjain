name: Refresh profile cards

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile README
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font subsetting tool
        run: python -m pip install --upgrade fonttools

      - name: Refresh contribution data and render cards
        run: python build_cards.py --refresh-data

      - name: Commit updated cards and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md cards/ data/contributions.json
          if git diff --cached --quiet; then
            echo "No profile card changes to commit."
          else
            git commit -m "Refresh animated profile cards"
            git push
          fi
